[project]
name = "media115"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx[socks]",
    "fastapi",
    "uvicorn",
    "lxml",
    "click",
    "pyyaml",
]

[project.scripts]
"media115" = "media115.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pytest-cov", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108", "SIM117"]

[tool.coverage.run]
source = ["media115"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["live: tests that require network access (TMDB, Bangumi, CDN)"]

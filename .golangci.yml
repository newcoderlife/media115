version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - bodyclose
    - rowserrcheck
    - nolintlint
    - gosec
    - copyloopvar
    - durationcheck
    - unconvert
    - wastedassign
  exclusions:
    rules:
      - linters: [errcheck, gosec]
        path: _test\.go
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*mime/multipart.Writer).Close
        - (*io.PipeWriter).Close
        - (*github.com/newcoderlife/media115/internal/cloud115.Client).Close
        - (*github.com/newcoderlife/media115/internal/cloud115.Cache).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      disabled-checks:
        - ifElseChain
    gosec:
      excludes:
        - G101  # hardcoded credentials — TokenSalt is a public constant
        - G115  # integer overflow — intentional crypto/timestamp conversions
        - G301  # dir perm 0755 — standard for config/cache/log dirs
        - G302  # file perm 0644 — standard for log files
        - G304  # file inclusion — internal paths, not user input
        - G306  # WriteFile perm 0644 — standard for NFO/config
        - G401  # weak crypto — 115 API requires md5/sha1
        - G501  # blocklisted md5 — 115 API protocol
        - G505  # blocklisted sha1 — 115 API protocol
        - G104  # errors unhandled — covered by errcheck
        - G202  # SQL concat — table names are hardcoded constants
        - G703  # path traversal via taint — internal paths, not user input
        - G704  # SSRF via taint — serve.go is a proxy by design
    staticcheck:
      checks:
        - all
        - -ST1005
        - -ST1000
        - -QF1003
        - -QF1008

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/newcoderlife/media115
